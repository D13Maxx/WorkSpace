[package]
name = "ws-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Workspace: a desktop AI workspace with its own inference engine"

[lints]
workspace = true

[lib]
name = "ws_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
ws-context.workspace = true
ws-core.workspace = true
ws-store.workspace = true
ws-secrets.workspace = true
ws-providers.workspace = true
ws-engine.workspace = true
ws-mcp.workspace = true
async-trait.workspace = true
tauri = { version = "2.11", features = [] }
# The native open-file/folder picker. Only its open command is granted.
tauri-plugin-dialog = "2.8.2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-util.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
