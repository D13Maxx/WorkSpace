[package]
name = "ws-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ws: a coordinator and parallel workers on a folder, from the terminal"

[lints]
workspace = true

[[bin]]
name = "ws"
path = "src/main.rs"

[dependencies]
ws-context.workspace = true
ws-core.workspace = true
ws-store.workspace = true
ws-providers.workspace = true
ws-tools.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "signal"] }
tokio-util.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
ws-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
